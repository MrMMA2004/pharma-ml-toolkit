name: security-scan

# part13 §17's CI-side lane: automated dependency vulnerability scanning.
# §17's own rule holds verbatim — "Do not add network-dependent security
# services to the runtime application. Security scanning may run in CI."
# — so this workflow never touches the loopback-bound runtime service;
# it audits the pinned dependency stack and the SBOM/tree hygiene on
# GitHub's runners only, on a weekly schedule plus manual dispatch.

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-dependency-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the auditor
        run: python -m pip install pip-audit

      - name: Audit the pinned core stack
        working-directory: pharma-ml-toolkit
        run: pip-audit --strict -r requirements.txt

  frontend-dependency-audit:
    name: Studio frontend audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit the locked frontend tree
        working-directory: pharma-ml-toolkit/frontend
        run: npm audit --audit-level=high

  sbom-and-tree-guard:
    name: SBOM and tree hygiene guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the runner
        run: python -m pip install pytest==9.0.2

      - name: Run the local supply-chain guard (part13 §17)
        working-directory: pharma-ml-toolkit
        run: python -m pytest tests/test_security_supply_chain.py -q
