name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-page:
    name: GitHub page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate landing page and citation metadata
        run: |
          python scripts/check_github_page.py
          python -m unittest discover -s tests -p 'test_github_page.py' -v

  studio-frontend:
    name: Studio frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pharma-ml-toolkit
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pharma-ml-toolkit/frontend/package-lock.json

      - name: Set up Python for workflow contract tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the locked Studio frontend dependencies
        run: npm ci --prefix frontend

      - name: Type-check and build the offline Studio frontend
        run: npm --prefix frontend run build

      - name: Install the pinned test runner
        run: python -m pip install pytest==9.0.2

      - name: Run frontend and workspace contract guards
        run: >-
          python -m pytest
          tests/test_frontend_foundation.py
          tests/test_frontend_services.py
          tests/test_frontend_startup.py
          tests/test_*_workspace.py
          tests/test_windows_pipeline.py
          -o addopts="-q --tb=short"

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: pharma-ml-toolkit
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pharma-ml-toolkit/pyproject.toml
            pharma-ml-toolkit/requirements.txt

      - name: Install verified package and QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install -c requirements.txt \
            pytest==9.0.2 pytest-cov==7.0.0 mypy==2.4.0 ruff==0.17.1 \
            matplotlib==3.10.9 seaborn==0.13.2 fpdf2==2.8.5 \
            python-docx==1.2.0 Pillow==11.3.0

      - name: Lint Python package
        run: ruff check src/pharmaml

      - name: Type-check package
        run: mypy src/pharmaml

      - name: Run focused core tests
        run: >-
          python -m pytest
          tests/test_checkpoint_restore_transaction.py
          tests/test_checkpoint_build_safety.py
          tests/test_checkpoint_ship_safety.py
          tests/test_build_zip_safety.py
          tests/test_release_recovery_status.py
          tests/test_resume_release.py
          tests/test_cv_parameters_integrity.py
          tests/test_cv_group_labels_integrity.py
          tests/test_vina_output_integrity.py
          tests/test_grid_geometry_compatibility.py
          tests/test_release_audit.py
          tests/test_data_drift_diagnostic.py
          tests/test_data_loading.py
          tests/test_pk.py
          tests/test_md_plots.py
          tests/test_multiobjective_hpo.py
          tests/test_pareto_shortlist_plot.py
          tests/test_conformal.py
          tests/test_conformal_classification.py
          tests/test_label_conditional_conformal.py
          tests/test_coverage_diagnostics.py
          tests/test_applicability_schema.py
          tests/test_splits_integrity.py
          tests/test_cv_scaffold_integrity.py
          tests/test_split_overlap_audit.py
          tests/test_cli_split_audit.py
          tests/test_file_split_audit.py
          tests/test_evaluation_auc_integrity.py
          -o addopts="-q --tb=short"

      - name: Smoke-test chart exports
        run: |
          python examples/chart_readability.py
          test -s artifacts/chart-readability/concentration-profile.png
          test -s artifacts/chart-readability/concentration-profile.svg
          test -s artifacts/chart-readability/concentration-profile.pdf
          test -s artifacts/chart-readability/concentration-profile.html

  windows-engine-smoke:
    name: Windows bundled engine smoke
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: pharma-ml-toolkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Invoke bundled engines and dock a synthetic Vina toy
        run: python tools/windows_engine_smoke.py

  windows-engine-integration:
    name: Windows docking integration (synthetic)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pharma-ml-toolkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install toolkit core
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Exercise bundled engines via toolkit workflows
        run: python tools/windows_engine_integration.py

  generative-sa:
    name: Generative SA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pharma-ml-toolkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install chemistry and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install -c requirements.txt pytest==9.0.2 rdkit==2026.9.1
      - name: Test SA scoring and generation integration
        run: >-
          python -m pytest tests/test_sa_score.py tests/test_generative_sa_cli.py
          tests/test_ga_cooperative_stop.py tests/test_ga_checkpoint_identity.py
          tests/test_generative_search_resumability.py tests/test_heldout_partition.py
          -o addopts="-q --tb=short"
      - name: Test release portability and checkout-only guards
        run: >-
          python -m pytest tests/test_release_portability.py tests/test_checkpoint_tooling.py
          --junitxml="$RUNNER_TEMP/portability.xml" -o addopts="-q --tb=short"
      - name: Annotate portability failures
        if: failure()
        run: |
          python - <<'PY'
          import contextlib
          import io
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          import numpy as np
          runtime = io.StringIO()
          with contextlib.redirect_stdout(runtime):
              np.show_runtime()
          text = runtime.getvalue().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::notice::NumPy runtime for portability failure: {text}')
          probe = subprocess.run([sys.executable, 'tools/diagnose_data_drift.py'], text=True, capture_output=True, check=False)
          try:
              diagnostic = json.loads(probe.stdout)
              detail = json.dumps({'exit': probe.returncode, 'environment': diagnostic['environment'], 'differences': diagnostic['generated_files_with_byte_drift']})
              detail = detail[:20000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice::Strict data drift diagnostic (no tolerance applied): {detail}')
          except (ValueError, KeyError):
              print(f'::notice::Data drift diagnostic did not produce JSON; exit {probe.returncode}')
          report = Path(os.environ['RUNNER_TEMP']) / 'portability.xml'
          if report.is_file():
              for case in ET.parse(report).iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      text = f"{case.get('classname')}::{case.get('name')}\n{failure.text or failure.get('message', '')}"
                      text = text[:30000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error::{text}')
          PY

  sklearn-compatibility:
    name: scikit-learn ${{ matrix.sklearn-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sklearn-version: ["1.3.0", "1.5.2", "1.8.0"]
    defaults:
      run:
        working-directory: pharma-ml-toolkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned base and selected scikit-learn
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps "scikit-learn==${{ matrix.sklearn-version }}" -e .
          python -m pip install pytest==9.0.2
      - name: Test estimator and conformal behavior
        run: >-
          python -m pytest tests/test_estimator_compatibility.py tests/test_conformal.py
          tests/test_conformal_classification.py tests/test_label_conditional_conformal.py
          tests/test_coverage_diagnostics.py tests/test_heldout_diagnostics.py tests/test_research_audit.py
          tests/test_uncertainty_workbench.py tests/test_classification_workbench.py
          tests/test_research_provenance.py
          tests/test_validation_workbench.py tests/test_nested_classification.py tests/test_probability_calibration.py tests/test_training_provenance.py tests/test_checkpoint_diagnostics.py tests/test_studio_diagnostics.py
          -o addopts="-q --tb=short"

  chemistry-docking:
    name: Chemistry and docking preparation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pharma-ml-toolkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install scientific and preparation dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install -c requirements.txt pytest==9.0.2 rdkit==2026.9.1 mordred==1.2.0 meeko==0.8.0 gemmi==0.7.5
      - name: Run descriptor, preparation, and docking workflow tests
        run: python -m pytest tests/test_descriptors.py tests/test_docking_prep.py tests/test_engine_discovery_part5.py tests/test_campaign.py tests/test_campaign_preview.py tests/test_campaign_launch.py tests/test_campaign_status.py tests/test_campaign_preparation.py tests/test_docking.py tests/test_docking_contacts.py tests/test_pose_rmsd.py -o addopts="-q --tb=short"

  studio-md:
    name: Studio MD
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PySide6
    defaults:
      run:
        working-directory: pharma-ml-toolkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Studio and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install -c requirements.txt -e '.[gui-test]' \
            pytest==9.0.2 pytest-qt==4.5.0 matplotlib==3.10.9 \
            PySide6==6.8.3 pyqtgraph==0.13.7 qt-material==2.17 qdarkstyle==3.2.3
      - name: Test MD Studio and navigation offscreen
        run: >-
          python -m pytest
          tests/ui/test_molecular_dynamics_page.py
          tests/ui/test_data_audit_page.py
          tests/ui/test_file_split_audit.py
          tests/ui/test_manifest_and_ga_stop.py
          tests/ui/test_ml_statistical_tools.py
          tests/ui/test_ml_statistics_batch2.py
          tests/ui/test_phase3_batch4.py::test_conformal_sets_end_to_end
          tests/ui/test_phase3_batch4.py::test_conformal_classification_uses_disjoint_rows
          tests/ui/test_research_workflows.py
          tests/ui/test_nine_cards.py::TestHonesty::test_docking_card_declares_engine_and_runtime_boundaries
          tests/ui/test_main_window.py
          tests/ui/test_foundations_page.py::test_main_window_carries_the_foundations_section
          tests/ui/test_bestofml_page.py::test_main_window_carries_the_bestofml_section
          tests/ui/test_responseai_page.py::test_main_window_carries_the_responseai_section
          tests/ui/test_image_lab_page.py::test_main_window_registers_image_lab
          -o addopts="-q --tb=short"

  web:
    name: Web console
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./db/custom.db
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint web console
        run: bun run lint

      - name: Verify code theme server rendering
        run: bun run tests/code-block-ssr.tsx

      - name: Build web console
        run: bun run build
