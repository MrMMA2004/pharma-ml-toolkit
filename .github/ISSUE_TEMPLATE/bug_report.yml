name: Bug report
description: Report a reproducible correctness, crash or interface problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, private datasets or patient-identifiable information. Use a [private security advisory](https://github.com/MrMMA2004/pharma-ml-toolkit/security/advisories/new) for vulnerabilities.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Python package
        - PharmaML Studio
        - Web console
        - CLI
        - Notebook or example
        - Documentation
        - Installation or packaging
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PharmaML version or commit
      placeholder: "v1.2.145 or a full commit SHA"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime versions
      description: "For example: Python 3.12 and PySide6 6.8.3, or Bun 1.3 and Next.js 16."
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error text and relevant stack trace.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal, non-sensitive example whenever possible.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional dependencies, screenshots, logs or possible causes.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and used a minimal non-sensitive example.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
