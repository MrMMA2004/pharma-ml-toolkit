[package]
name = "pharmaml-studio"
version = "1.2.251"  # version-carrier alignment (part20 §7.1): tauri.conf.json/VERSION/pyproject all ship 1.2.244; the crate version was left at 1.2.229 across the r229→r243 releases
description = "The PharmaML Studio desktop host (Tauri 2): the offline WebView2 shell, the Python backend sidecar supervisor, and nothing else — no scientific logic lives in Rust (part11 §3)."
authors = ["PharmaML contributors"]
license = "MIT"
repository = "https://github.com/MrMMA2004/pharma-ml-toolkit"
edition = "2021"
rust-version = "1.90"  # tauri 2.12.x MSRV (r294; was 1.77 — predates the tauri 2.12 era)

# The Rust host stays MINIMAL (part11 §5.2: "Keep the Rust
# implementation minimal").  Only the core crate — no plugins, no
# shell/fs/dialog capabilities, no second backend.
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "pharmaml_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Windows runner verification legs run `cargo build --release`;
# release profile defaults stay sane for a desktop host.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
