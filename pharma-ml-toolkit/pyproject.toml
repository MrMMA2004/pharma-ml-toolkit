[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmaml"
version = "1.0.0"
description = "A production-ready toolkit for QSAR machine learning, pharmaceutical calculations (PK/PD/dosage), and molecular-docking workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PharmaML contributors" }]
keywords = [
    "qsar",
    "machine-learning",
    "pharmacokinetics",
    "pharmacodynamics",
    "molecular-docking",
    "autodock",
    "cheminformatics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "joblib>=1.3",
    "openpyxl>=3.1",
    "tqdm>=4.65",
]

[project.optional-dependencies]
chem = [
    "rdkit-pypi>=2023.9",
    "mordred>=1.2",
]
boosting = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
]
reports = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "fpdf>=1.7",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.5",
    "ruff>=0.4",
]

[project.scripts]
pharmaml = "pharmaml.cli:main"

[project.urls]
Homepage = "https://github.com/example/pharma-ml-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
