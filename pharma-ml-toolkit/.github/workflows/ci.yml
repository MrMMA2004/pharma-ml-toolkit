name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests ui

      - name: Type-check (mypy, blocking since 100x-22-c: 0-error baseline)
        run: mypy src/pharmaml

      - name: Run test suite
        run: python -m pytest --cov=pharmaml --cov-report=term-missing

  test-full-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with chem + boosting extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[chem,boosting,dev]"
      - name: Run full test suite (including RDKit-dependent tests)
        run: python -m pytest
