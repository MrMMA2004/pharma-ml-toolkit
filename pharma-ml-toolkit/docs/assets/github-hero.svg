<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title description">
  <title id="title">PharmaML Toolkit — science, from data to insight</title>
  <desc id="description">An abstract molecular network and a clearly labeled illustrative model-evaluation curve accompany the PharmaML Toolkit title; no experimental results are shown.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102936"/><stop offset="1" stop-color="#071a24"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a6ecd0"/><stop offset="1" stop-color="#68c7c3"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#bee9df" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="370" rx="18" fill="url(#background)"/>
  <rect width="1200" height="370" rx="18" fill="url(#grid)"/>
  <rect x="52" y="43" width="9" height="9" rx="2" fill="#9de5c4"/>
  <text x="75" y="52" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.8" fill="#a8dacb">PHARMAML TOOLKIT</text>
  <text x="52" y="122" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="-.8" fill="#f4fbf8">Science, from data</text>
  <text x="52" y="174" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="-.8" fill="#f4fbf8">to insight<tspan fill="#9de5c4">.</tspan></text>
  <text x="54" y="213" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#c2d7d2">Molecular science  /  machine learning  /  PK–PD</text>
  <path d="M54 250H104" stroke="#9de5c4" stroke-width="3" stroke-linecap="round"/>
  <text x="118" y="254" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.7" fill="#a9c5bd">OPEN SOURCE · LOCAL-FIRST RESEARCH</text>
  <text x="54" y="326" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing=".5" fill="#88aaa4">TOOLS FOR EXPLORATION, EVALUATION AND REVIEW</text>
  <g transform="translate(725 37)">
    <rect width="420" height="296" rx="16" fill="#112f38" stroke="#91d8c6" stroke-opacity=".27"/>
    <text x="24" y="33" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#b3d8cb">A RESEARCH WORKFLOW</text>
    <text x="396" y="33" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8eafa8">ILLUSTRATIVE</text>
    <path d="M24 50H396" stroke="#b1ded2" stroke-opacity=".17"/>
    <text x="25" y="81" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.4" fill="#a3c6bd">MOLECULAR DATA</text>
    <g fill="none" stroke="#95ddc8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M48 133l30-18 30 18v35l-30 18-30-18z M108 133l30-18 30 18v35l-30 18-30-18 M78 115V97 M168 133l18-11 M138 186l10 16"/>
      <circle cx="78" cy="97" r="4" fill="#9de5c4" stroke="none"/><circle cx="186" cy="122" r="4" fill="#9de5c4" stroke="none"/><circle cx="148" cy="202" r="4" fill="#9de5c4" stroke="none"/>
    </g>
    <path d="M210 93V212" stroke="#b1ded2" stroke-opacity=".13"/>
    <text x="235" y="81" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.4" fill="#a3c6bd">MODEL &amp; EVALUATE</text>
    <path d="M238 190H385 M238 190V106" fill="none" stroke="#afcfc6" stroke-opacity=".35"/>
    <path d="M240 178 C258 174 269 159 282 144 S307 116 321 129 343 159 356 142 373 118 384 113" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <g fill="#c5f3d0"><circle cx="282" cy="144" r="3.5"/><circle cx="321" cy="129" r="3.5"/><circle cx="384" cy="113" r="3.5"/></g>
    <path d="M24 229H396" stroke="#b1ded2" stroke-opacity=".17"/>
    <text x="25" y="262" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#b7dcd0">EXPLORE</text>
    <text x="145" y="262" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#b7dcd0">MODEL</text>
    <text x="250" y="262" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#b7dcd0">VALIDATE</text>
    <text x="357" y="262" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#b7dcd0">REPORT</text>
  </g>
