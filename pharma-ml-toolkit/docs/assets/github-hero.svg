    <radialGradient id="glow"><stop stop-color="#0f8279" stop-opacity=".32"/><stop offset="1" stop-color="#0f8279" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#b8e9de" stroke-opacity=".045"/></pattern>
