  <text x="54" y="183" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="-1" fill="#f4fbf8">to research insight<tspan fill="#8de6ba">.</tspan></text>
  <text x="56" y="225" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#bbd2cb">Machine learning  /  pharmacology  /  molecular science</text>
